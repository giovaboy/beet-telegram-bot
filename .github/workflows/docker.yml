# Run the tests, then build the image and publish it to Docker Hub,
# on every push to main. A failing test means no new image.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.env.example'
      - '.gitignore'
      - 'LICENSE'
      - '*.jpg'
      - 'beet-telegram-bot.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # same as the image (python:3.11-slim)
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt pytest==7.4.3 pytest-asyncio==0.23.2

      # Tests must pass. The 70% coverage threshold of pytest.ini (used by the
      # Dockerfile 'testing' stage) is not enforced here.
      - run: python -m pytest -o addopts="-ra --strict-markers"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: latest + short commit hash (e.g. giovaboy/beet-telegram-bot:0f38b58)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: giovaboy/beet-telegram-bot
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production   # the Dockerfile is multi-stage: development/testing stages are not shipped
          platforms: linux/amd64   # the Dockerfile downloads the x86_64 docker CLI
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

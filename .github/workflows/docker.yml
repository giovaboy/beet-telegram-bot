# Build the image and publish it to Docker Hub on every push to main
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.env.example'
      - '.gitignore'
      - 'LICENSE'
      - '*.jpg'
      - 'beet-telegram-bot.yml'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: latest + short commit hash (e.g. giovaboy/beet-telegram-bot:0f38b58)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: giovaboy/beet-telegram-bot
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production   # the Dockerfile is multi-stage: development/testing stages are not shipped
          platforms: linux/amd64   # the Dockerfile downloads the x86_64 docker CLI
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

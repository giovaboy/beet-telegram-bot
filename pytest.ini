[pytest]
# Pytest configuration for beet-telegram-bot

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=core
    --cov=ui
    --cov=handlers
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_docker: marks tests that need Docker running
    requires_network: marks tests that need network access
    fixture_required: marks tests that require specific fixtures

# Coverage options
[coverage:run]
branch = True
source = 
    core
    ui
    handlers
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Paths
[coverage:paths]
source =
    core/
    ui/
    handlers/

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
